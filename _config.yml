title: "Žemaitytė"
description: "Personal website."
baseurl: ""
url: "https://zemaityte.lt"
google_analytics: "G-99PM8BS036"

markdown: kramdown
theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: /:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - README.md
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
